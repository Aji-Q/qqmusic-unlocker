name: build-macos

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install "pyinstaller==6.*"
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          ffmpeg -hide_banner -encoders 2>&1 | grep libmp3lame
      - name: Offline regression tests
        timeout-minutes: 3
        run: |
          python -u - <<'PY'
          import faulthandler, unittest
          faulthandler.dump_traceback_later(60, exit=True)
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('tests'))
          faulthandler.cancel_dump_traceback_later()
          raise SystemExit(not result.wasSuccessful())
          PY
      - name: Build self-contained application
        run: PYTHON=python ./build.sh
      - name: Verify relocated application without Homebrew or Python in PATH
        run: |
          python mac/check_bundle.py "dist/QQ音乐解锁器.app" --report mac-selftest.json
          python - <<'PY'
          import plistlib
          from pathlib import Path
          info = plistlib.loads(Path('dist/QQ音乐解锁器.app/Contents/Info.plist').read_bytes())
          minimum = tuple(map(int, info['LSMinimumSystemVersion'].split('.')))
          assert minimum <= (15, 0), f'Bundle unexpectedly requires macOS {minimum}'
          PY
      - name: Save verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-selftest
          path: mac-selftest.json
          if-no-files-found: warn
      - name: Package application
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist/package
          ditto "dist/QQ音乐解锁器.app" "dist/package/QQ音乐解锁器.app"
          cp mac/使用说明.txt dist/package/
          ditto -c -k --sequesterRsrc dist/package "QQMusicUnlocker-macos-$ARCH.zip"
          shasum -a 256 "QQMusicUnlocker-macos-$ARCH.zip" > "QQMusicUnlocker-macos-$ARCH.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: QQMusicUnlocker-macos-${{ matrix.arch }}
          path: |
            QQMusicUnlocker-macos-${{ matrix.arch }}.zip
            QQMusicUnlocker-macos-${{ matrix.arch }}.zip.sha256
      - name: Attach binaries to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            QQMusicUnlocker-macos-${{ matrix.arch }}.zip
            QQMusicUnlocker-macos-${{ matrix.arch }}.zip.sha256
