name: Check web
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/check-web.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/check-web.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: python -m py_compile tests/browser_acceptance.py tests/generate_qmc_fixtures.py
      - run: npm test
      - run: npm run build
