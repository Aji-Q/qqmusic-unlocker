name: build-windows

# Windows 构建、离线转码及 WebView2 窗口验证；标签额外发布 Release。
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write      # 打标签时创建 Release 需要
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装打包依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # pywebview 在 Windows 上会一并拉入 pythonnet，走系统自带的 WebView2
          python -m pip install "pyinstaller==6.*" "pywebview==5.4"

      - name: 离线回归测试
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: 下载并校验 ffmpeg（Gyan 静态构建，GPLv3）
        shell: pwsh
        run: |
          $base = "https://www.gyan.dev/ffmpeg/builds"
          Invoke-WebRequest "$base/ffmpeg-release-essentials.zip" -OutFile ff.zip
          Invoke-WebRequest "$base/ffmpeg-release-essentials.zip.sha256" -OutFile ff.sha256
          $want = (Get-Content ff.sha256).Trim().Split()[0].ToLower()
          $got  = (Get-FileHash ff.zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $want) { throw "ffmpeg 压缩包 SHA256 不符：want=$want got=$got" }
          Expand-Archive ff.zip -DestinationPath fftmp -Force
          $bin = Get-ChildItem fftmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $bin.FullName ffmpeg.exe
          Copy-Item (Join-Path $bin.Directory "ffprobe.exe") ffprobe.exe
          $ffVersion = (./ffmpeg.exe -hide_banner -version | Select-Object -First 1)
          Write-Output $ffVersion
          $appVersion = python -c "import sys; sys.path.insert(0, 'app'); from version import APP_VERSION; print(APP_VERSION)"
          @{
            app_version = $appVersion
            source_commit = $env:GITHUB_SHA
            source_ref = $env:GITHUB_REF
            build_url = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            platform = "windows-x64"
            python = (python --version)
            ffmpeg_version = $ffVersion
            ffmpeg_archive_url = "$base/ffmpeg-release-essentials.zip"
            ffmpeg_archive_sha256 = $got
          } | ConvertTo-Json | Set-Content -Encoding utf8 BUILD-INFO.json
          # 确认带 libmp3lame（转 MP3 必需）
          if (-not (./ffmpeg.exe -hide_banner -encoders 2>&1 | Select-String libmp3lame)) {
            throw "ffmpeg 不含 libmp3lame 编码器"
          }

      - name: PyInstaller 打包（统一 spec）
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean QQMusicUnlocker.spec

      - name: 打包程序离线自检与 WebView2 窗口检查
        shell: pwsh
        run: |
          # GUI 子系统没有可靠 stdout；读取 JSON 报告并检查进程退出码。
          # 加空格和中文目录名，覆盖常见 Windows 安装路径。
          $smokeRoot = Join-Path $env:RUNNER_TEMP "中文 测试"
          Copy-Item dist\QQMusicUnlocker $smokeRoot -Recurse -Force
          $exe = Join-Path $smokeRoot "QQMusicUnlocker.exe"
          foreach ($mode in @("selftest", "gui-selftest")) {
            $report = Join-Path $env:GITHUB_WORKSPACE "$mode.json"
            $process = Start-Process -FilePath $exe `
              -ArgumentList "--$mode --selftest-report `"$report`"" -PassThru
            if (-not $process.WaitForExit(90000)) {
              Stop-Process -Id $process.Id -Force
              throw "$mode 超过 90 秒未结束"
            }
            $process.Refresh()
            if (-not (Test-Path $report)) { throw "$mode 未生成 JSON 报告，退出码 $($process.ExitCode)" }
            Get-Content $report
            $result = Get-Content $report -Raw -Encoding utf8 | ConvertFrom-Json
            if ($process.ExitCode -ne 0 -or $result.ok -ne $true) {
              throw "$mode 失败，退出码 $($process.ExitCode)"
            }
          }

      - name: 保存自检报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-selftest-reports
          path: |
            selftest.json
            gui-selftest.json
          if-no-files-found: warn

      - name: 附带许可与说明，打包 zip
        shell: pwsh
        run: |
          $dst = "dist\QQMusicUnlocker"
          New-Item -ItemType Directory -Force "$dst\LICENSES" | Out-Null
          @"
          本程序随附的 ffmpeg.exe / ffprobe.exe 为 Gyan.dev 发布的静态构建，许可 GPLv3。
          源码与构建说明：https://www.gyan.dev/ffmpeg/builds/
          FFmpeg 项目：https://ffmpeg.org/   源码：https://github.com/FFmpeg/FFmpeg
          "@ | Set-Content -Encoding utf8 "$dst\LICENSES\FFMPEG.txt"
          if (Test-Path README.md) { Copy-Item README.md "$dst\README.md" }
          Copy-Item win\快速开始.txt $dst -Force
          Copy-Item BUILD-INFO.json $dst -Force
          # 使用辅助脚本：拖文件到 bat 上转换 / 一键建桌面快捷方式
          Copy-Item win\Convert-dropped-files.bat $dst -Force
          Copy-Item "win\创建桌面快捷方式.ps1" $dst -Force
          $zip = "QQMusicUnlocker-windows-x64.zip"
          # 保留单一顶层目录，避免用户将 exe 与 _internal 拆开。
          Compress-Archive -Path $dst -DestinationPath $zip -Force
          $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$h  $zip" | Set-Content -Encoding utf8 "$zip.sha256"
          "SHA256: $h"
          Get-ChildItem $dst | Select-Object Name, Length | Format-Table

      - uses: actions/upload-artifact@v4
        with:
          name: QQMusicUnlocker-windows-x64
          path: |
            QQMusicUnlocker-windows-x64.zip
            QQMusicUnlocker-windows-x64.zip.sha256

      - name: 打标签时发 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            QQMusicUnlocker-windows-x64.zip
            QQMusicUnlocker-windows-x64.zip.sha256
          body: |
            从下方 Assets 下载与你的电脑对应的应用包。`Source code` 是源码，不是应用。

            - Windows x64：`QQMusicUnlocker-windows-x64.zip`。完整解压后打开文件夹内的 `QQMusicUnlocker.exe`；缺少 WebView2 时应用会引导前往微软官网。
            - Mac Apple 芯片：`QQMusicUnlocker-macos-arm64.zip`；Mac Intel：`QQMusicUnlocker-macos-x64.zip`。需要 macOS 15 或更新版本，解压后把 app 拖进「应用程序」。

            应用包自带 Python 与 ffmpeg，无需另装开发工具。Mac 包尚未通过 Developer ID 公证；首次打开被拦截时，请先核对下载来源，再到「系统设置 → 隐私与安全性 → 仍要打开」。

            打开 QQ 音乐并登录，在 QQ 音乐中下载歌曲；把本地加密文件拖入本应用即可转换。输出目录与码率会记住，同名结果自动编号。

            [安装、使用与故障处理](https://github.com/Aji-Q/qqmusic-unlocker#readme)。包内 `BUILD-INFO.json` 记录源码提交与打包依赖，`.sha256` 用于校验下载完整性。
            本次构建运行离线转码和窗口检查；真实 Windows QQ 音乐账号与在线解密尚未完成实机验证。
            源码提交：`${{ github.sha }}`；[构建日志](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})。
