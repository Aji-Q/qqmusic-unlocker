<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QQ 音乐解锁器</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="bar">
  <div class="brand">
    <div class="logo">♪</div>
    <div>
      <h1>QQ 音乐解锁器</h1>
      <p class="sub">把 .mgg / .mflac 拖进来就转成 MP3</p>
    </div>
  </div>
  <div class="status" id="statusBar">
    <span class="pill" id="pillFfmpeg">检测中…</span>
    <span class="pill link" id="pillAccount" title="点一下看怎么处理">账号检测中…</span>
    <button class="ghost" id="btnReloadCred" title="QQ 音乐重新登录后点这里">重新检测登录</button>
  </div>
</header>

<main>
  <section class="card drop" id="dropZone">
    <div class="dropInner">
      <strong id="dropTitle">把 .mgg / .mflac 拖进来</strong>
      <span id="dropHint">拖进来就自动开始转换，不用再点按钮</span>
      <div class="row" id="pickRow">
        <button class="primary" id="btnPickFiles">选择文件</button>
        <button class="ghost" id="btnPickFolder">选择文件夹</button>
        <button class="ghost" id="btnAddPath">输入路径</button>
      </div>
    </div>
  </section>

  <section class="card result" id="resultBar" hidden>
    <div class="resultMain">
      <div class="resultTitle" id="resultTitle">已完成</div>
      <div class="resultSub" id="resultSub"></div>
    </div>
    <div class="row">
      <button class="primary" id="btnOpenOut">打开输出文件夹</button>
      <button class="ghost" id="btnResultMore">看详情</button>
    </div>
  </section>

  <section class="card" id="queueCard" hidden>
    <div class="cardHead">
      <h2>转换队列 <span class="muted" id="queueCount"></span></h2>
      <div class="row">
        <button class="ghost small" id="btnClearDone">清除已完成</button>
        <button class="ghost small" id="btnClearAll">清空</button>
      </div>
    </div>
    <div class="tableWrap">
      <table id="queue">
        <thead>
          <tr><th>文件</th><th class="c-size">大小</th><th class="c-status">状态</th><th class="w30">进度 / 输出</th></tr>
        </thead>
        <tbody id="queueBody"></tbody>
      </table>
    </div>
  </section>

  <section class="card" id="settingsCard">
    <div class="cardHead">
      <h2>设置</h2>
      <button class="ghost small" id="btnToggleSettings">收起</button>
    </div>
    <div class="settings" id="settingsBody">
      <label>输出目录
        <div class="row">
          <input id="outdir" type="text" spellcheck="false">
          <button class="ghost small" id="btnPickOut">选择…</button>
          <button class="ghost small" id="btnReveal">打开</button>
        </div>
      </label>
      <label>MP3 码率
        <select id="bitrate">
          <option value="320k">320 kbps（推荐）</option>
          <option value="256k">256 kbps</option>
          <option value="192k">192 kbps</option>
          <option value="128k">128 kbps</option>
        </select>
      </label>
      <label class="check">
        <input type="checkbox" id="keepOgg"> 保留解密后的 .ogg 中间文件
      </label>
    </div>
  </section>
</main>

<footer class="bar bottom">
  <div class="progressWrap">
    <div class="progress"><div class="progressFill" id="progFill"></div></div>
    <span class="muted" id="progText">等待文件</span>
  </div>
  <div class="row">
    <button class="primary" id="btnStart">开始转换</button>
    <button class="ghost" id="btnStop" disabled>停止</button>
    <button class="ghost" id="btnLog">日志</button>
    <button class="ghost" id="btnQuit" title="关闭本地服务进程">退出</button>
  </div>
</footer>

<aside class="drawer" id="drawer">
  <div class="cardHead">
    <h2>运行日志</h2>
    <button class="ghost small" id="btnCloseLog">收起</button>
  </div>
  <div class="logs" id="logs"></div>
</aside>

<div class="modal" id="helpModal" hidden>
  <div class="modalBox">
    <div class="cardHead">
      <h2 id="helpTitle">需要先登录 QQ 音乐</h2>
      <button class="ghost small" id="btnCloseHelp">关闭</button>
    </div>
    <div class="helpBody" id="helpBody"></div>
    <div class="row" style="margin-top:12px">
      <button class="primary" id="btnHelpRetry">重新检测登录</button>
      <button class="ghost" id="btnHelpCopy">复制排查信息</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
